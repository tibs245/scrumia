  <rect x="6" y="9" width="5" height="14" rx="1.5" fill="#3B7CAD"/>
  <rect x="13.5" y="9" width="5" height="14" rx="1.5" fill="#73E3FF"/>
  <rect x="21.5" y="9.75" width="4.5" height="12.5" rx="1.5" fill="none" stroke="#3B7CAD" stroke-width="1.5" stroke-dasharray="3 2.5"/>
</svg>
