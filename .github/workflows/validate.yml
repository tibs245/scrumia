name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # validate.py runs scrumia-extends, which reads the config with yq or PyYAML.
      # Installed here rather than further down: the first step that needs it wins.
      - name: Install the YAML reader the shell tools fall back on
        run: python3 -m pip install --quiet pyyaml
      - name: Validate the manifest, the specs tree, and every module through scrumia-module
        run: python3 tools/validate.py
      - name: Check the gate's own rules, and that it delegates the module ones
        run: python3 tools/test_validate.py
      - name: Check the module checker against the anatomy standard's criteria
        run: python3 tools/test_module_check.py
      - name: Test the site builder's guards
        run: python3 tools/test_build_site.py
      - name: Check the extends section against its acceptance criteria
        run: python3 tools/test_extends_map.py
      - name: Check the composer's rows against the files it pre-renders
        run: python3 tools/test_composer.py
      - name: Check the composition summary against its acceptance criteria
        run: python3 tools/test_compose_status.py
      - name: Check the module keys and the settings cascade
        run: python3 tools/test_scrumia_extends.py
      - name: Check that the modules consume the settings cascade
        run: python3 tools/test_settings_cascade.py
      - name: Check design token contrast and hue separation
        run: python3 tools/check_contrast.py
      - name: Rebuild the site and check the committed output is current
        run: |
          python3 tools/build_site.py
          git diff --exit-code site/
