name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifests, skills, hooks and links
        run: python3 tools/validate.py
      - name: Rebuild the site and check the committed output is current
        run: |
          python3 tools/build_site.py
          git diff --exit-code site/
